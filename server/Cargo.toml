[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "std"] }
hex = "0.4"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
